{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Create account</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username <input name="username" required autofocus autocomplete="username"
           pattern="[A-Za-z0-9_]{3,30}" title="3-30 letters, numbers or underscores"></label>
    <label>Password <input name="password" type="password" required minlength="8"
           autocomplete="new-password"></label>
    <button>Sign up</button>
  </form>
  <p>Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</section>
{% endblock %}
